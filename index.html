<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTORA CARGO 화물 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A3C6E;--navy-d:#12294D;--gold:#B8902A;--gold-l:#E9D9A6;--ink:#1d2433;--mute:#6b7487;--line:#dfe4ee;--bg:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Noto Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;padding:8px 20px}
header img{height:132px;width:132px;flex:none}
header b{color:var(--navy);font-size:20px;letter-spacing:.02em}
.hero{background:var(--navy);color:#fff;padding:44px 20px 52px}
.hero div{max-width:760px;margin:0 auto}
.hero h1{font-size:28px;line-height:1.35;margin:0 0 6px}
.hero p{margin:0 0 22px;color:#c9d4ea}
form.search{display:flex;gap:8px}
input,button{font:inherit}
input[type=text],input[type=email],input[type=password]{padding:12px 14px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{background:var(--gold);color:#1b1500;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;font-weight:700;white-space:nowrap}
button.navy{background:var(--navy);color:#fff}
button.plain{background:#e8ecf4;color:var(--ink);font-weight:500;padding:6px 10px;font-size:13px}
main{max-width:960px;margin:0 auto;padding:26px 16px 60px}
.msg{color:var(--mute);margin:8px 0}.err{color:#b3261e}
.ship{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.ship h2{margin:0;color:var(--navy);font-size:20px}
.ship .sub{color:var(--mute);margin:0 0 14px}
.now{background:var(--gold-l);border-left:4px solid var(--gold);padding:10px 14px;margin-bottom:18px;font-weight:500}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{position:relative;padding:0 0 18px 34px;color:var(--mute)}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{content:"";position:absolute;left:6px;top:8px;bottom:-8px;width:2px;background:var(--line)}
ol.steps li:last-child::before{display:none}
ol.steps li::after{content:"";position:absolute;left:0;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
ol.steps li.done{color:var(--ink)}
ol.steps li.done::before{background:var(--gold)}
ol.steps li.done::after{background:var(--gold);border-color:var(--gold)}
ol.steps li.cur{color:var(--navy);font-weight:700}
ol.steps li.cur::after{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 5px rgba(26,60,110,.18)}
ol.steps .d{display:block;font-weight:400;font-size:14px}
.lang{margin-left:auto;display:flex;border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.lang button{background:#fff;color:var(--navy);border-radius:0;padding:8px 14px;font-weight:700}
.lang button.on{background:var(--navy);color:#fff}
.adm .lang{display:none}
footer{text-align:center;color:var(--mute);font-size:13px;padding-bottom:30px}
footer a{color:var(--mute)}
.login{max-width:380px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input{width:auto;flex:1 1 150px}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
thead th{background:var(--navy);color:#fff;font-weight:500;min-width:170px}
thead th small{display:block;color:#c9d4ea;font-weight:400}
thead th:first-child,tbody th{min-width:140px;position:sticky;left:0;background:#eef1f7;color:var(--navy)}
thead th:first-child{background:var(--navy);color:#fff}
td input{padding:8px;width:100%}
td input.has{border-color:var(--gold);background:#fffaf0}
.saved{color:var(--gold);font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:16px}.panel p{margin:4px 0 10px}
@media(max-width:560px){form.search{flex-direction:column}.hero h1{font-size:23px}header img{height:92px;width:92px}header b{display:none}}
</style>
</head>
<body>
<header><img src="logo.png" alt="ALTORA CARGO 로고"><b>ALTORA CARGO</b>
  <div class="lang" role="group" aria-label="Language"><button data-l="kr" onclick="setLang('kr')">KR</button><button data-l="mn" onclick="setLang('mn')">MN</button></div></header>
<div id="app"></div>
<footer><a href="#admin">관리자</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== 설정: 아래 URL만 본인 것으로 바꾸세요 ===== */
const SUPABASE_URL = "https://piwahidjmhnunaswhrgb.supabase.co";
const SUPABASE_KEY = "sb_publishable_u5WXeoGR8I88MSuJ0Ev4Wg_ZFeEFPLF";
/* ============================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STAGES = [
  ["d1_altora_in","ALTORA 입고"],
  ["d2_airport_in","공항반입"],
  ["d3_icn_depart","인천 출발"],
  ["d4_ub_arrive","올란바타르 도착"],
  ["d5_customs_done","통관완료"],
  ["d6_branch_arrive","ALTORA 지사 도착"]
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");

/* ---------- 언어 (고객 화면: 한국어 / 몽골어) ---------- */
const TXT = {
  kr: {
    doc: "ALTORA CARGO 화물 조회",
    title: "내 화물이 지금 어디에 있는지 확인하세요",
    sub: "화물 번호를 입력하세요.",
    ph: "화물 번호 입력",
    go: "조회하기",
    wait: "조회 중입니다...",
    fail: "조회에 실패했습니다. 잠시 후 다시 시도하세요.",
    none: "일치하는 화물이 없습니다. 화물 번호를 다시 확인하세요.",
    cargo: "화물 번호",
    cur: "현재 위치",
    notyet: "아직 접수 전입니다.",
    plan: "예정",
    admin: "관리자",
    stages: ["ALTORA 입고", "공항반입", "인천 출발", "올란바타르 도착", "통관완료", "ALTORA 지사 도착"]
  },
  mn: {
    doc: "ALTORA CARGO ачаа шалгах",
    title: "Таны ачаа одоо хаана байгааг шалгана уу",
    sub: "Ачааны дугаараа оруулна уу.",
    ph: "Ачааны дугаар",
    go: "Шалгах",
    wait: "Шалгаж байна...",
    fail: "Шалгаж чадсангүй. Түр хүлээгээд дахин оролдоно уу.",
    none: "Тохирох ачаа олдсонгүй. Ачааны дугаараа дахин шалгана уу.",
    cargo: "Ачааны дугаар",
    cur: "Одоогийн байршил",
    notyet: "Ачаа хараахан бүртгэгдээгүй байна.",
    plan: "Хүлээгдэж байна",
    admin: "Админ",
    stages: ["ALTORA агуулахад хүлээн авсан", "Нисэх онгоцны буудалд оруулсан", "Инчоноос ниссэн", "Улаанбаатарт ирсэн", "Гаалийн бүрдүүлэлт хийгдсэн", "ALTORA салбарт ирсэн"]
  }
};
let LANG = "kr";
try { LANG = localStorage.getItem("lang") === "mn" ? "mn" : "kr"; } catch (e) {}
const T = k => TXT[LANG][k];
let lastQ = "";

function setLang(l){
  LANG = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyLang();
  route();
}
function applyLang(){
  document.documentElement.lang = LANG === "mn" ? "mn" : "ko";
  document.title = T("doc");
  const fa = document.querySelector("footer a");
  if (fa) fa.textContent = T("admin");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
}

function route(){
  const adm = location.hash === "#admin";
  document.body.classList.toggle("adm", adm);
  adm ? showAdmin() : showTrack();
}
window.addEventListener("hashchange", route);

/* ---------- 고객 조회 화면 ---------- */
function showTrack(){
  app.innerHTML = `
    <section class="hero"><div>
      <h1>${T("title")}</h1>
      <p>${T("sub")}</p>
      <form class="search" id="f">
        <input type="text" id="q" placeholder="${T("ph")}" required>
        <button>${T("go")}</button>
      </form>
    </div></section>
    <main><div id="out"></div></main>`;
  $("#f").onsubmit = e => { e.preventDefault(); search($("#q").value.trim()); };
  if (lastQ) { $("#q").value = lastQ; search(lastQ); }
}

async function search(q){
  lastQ = q;
  const out = $("#out");
  out.innerHTML = `<p class="msg">${T("wait")}</p>`;
  const { data, error } = await sb.rpc("track", { q });
  if (error) { out.innerHTML = `<p class="msg err">${T("fail")}</p>`; return; }
  if (!data.length) { out.innerHTML = `<p class="msg">${T("none")}</p>`; return; }
  out.innerHTML = data.map(card).join("");
}

function card(s){
  let cur = -1;
  STAGES.forEach(([k], i) => { if (s[k]) cur = i; });
  const L = TXT[LANG].stages;
  const now = cur < 0 ? T("notyet") : `${T("cur")}: ${L[cur]} (${s[STAGES[cur][0]]})`;
  const steps = STAGES.map(([k], i) => {
    const cls = i === cur ? "cur" : s[k] ? "done" : "";
    return `<li class="${cls}">${L[i]}<span class="d">${s[k] ? esc(s[k]) : T("plan")}</span></li>`;
  }).join("");
  return `<div class="ship">
    <h2 style="margin-bottom:14px">${T("cargo")} ${esc(s.cargo_no)}</h2>
    <div class="now">${esc(now)}</div>
    <ol class="steps">${steps}</ol></div>`;
}

/* ---------- 관리자 화면 ---------- */
let ALL = [];
const norm = s => String(s ?? "").replace(/\s+/g, "").toLowerCase();

async function fetchAll(cols){
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from("shipments").select(cols).order("id").range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}

async function showAdmin(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return loginView();
  app.innerHTML = `<main>
    <div class="bar"><b style="color:var(--navy);font-size:20px;flex:1 1 auto">관리자</b>
      <button class="plain" id="out">로그아웃</button></div>
    <div class="panel">
      <b>엑셀로 한꺼번에 올리기</b>
      <p class="msg">첫 줄에 <b>화물번호</b>와 6개 단계 이름을 쓰고, 날짜는 2026-10-09 형식으로 입력하세요. 이미 있는 화물번호는 입력한 칸만 수정됩니다.</p>
      <div class="bar"><button class="plain" id="tpl">엑셀 양식 내려받기</button>
        <button id="up">엑셀 파일 올리기</button>
        <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></div>
      <div id="res" class="msg"></div>
    </div>
    <div class="bar">
      <input type="text" id="sq" placeholder="화물 번호 검색">
      <input type="text" id="nc" placeholder="화물 번호 (한 건 추가)">
      <button class="plain" id="add">한 건 추가</button>
      <span id="st" class="saved"></span></div>
    <div class="wrap" id="grid"><p class="msg" style="padding:16px">불러오는 중...</p></div></main>`;
  $("#out").onclick = async () => { await sb.auth.signOut(); location.hash = ""; };
  $("#sq").oninput = renderGrid;
  $("#add").onclick = async () => {
    const cargo_no = $("#nc").value.trim();
    if (!cargo_no) return flash("화물 번호를 입력하세요.");
    if (ALL.some(s => s.cargo_no === cargo_no)) return flash("이미 있는 화물 번호입니다.");
    const { error } = await sb.from("shipments").insert({ cargo_no });
    if (error) return flash("추가하지 못했습니다: " + error.message);
    $("#nc").value = ""; loadGrid();
  };
  $("#tpl").onclick = () => {
    const head = ["화물번호", ...STAGES.map(s => s[1])];
    const ws = XLSX.utils.aoa_to_sheet([head, ["TEST001", "2026-10-01", "2026-10-02", "", "", "", ""]]);
    ws["!cols"] = head.map(() => ({ wch: 18 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "화물");
    XLSX.writeFile(wb, "ALTORA_화물_업로드_양식.xlsx");
  };
  $("#up").onclick = () => $("#file").click();
  $("#file").onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    const res = $("#res"); res.className = "msg"; res.textContent = "파일을 읽는 중...";
    try { await importExcel(f, res); }
    catch (err) { res.className = "msg err"; res.textContent = "올리지 못했습니다: " + (err.message || err); }
  };
  loadGrid();
}

function flash(t){ const s = $("#st"); if (s){ s.textContent = t; clearTimeout(flash.t); flash.t = setTimeout(() => s.textContent = "", 2500); } }

function fixDate(v){
  v = String(v ?? "").trim();
  if (!v) return "";
  const m = v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (!m) return null;
  const d = `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  return isNaN(new Date(d)) ? null : d;
}

async function importExcel(file, res){
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, dateNF: "yyyy-mm-dd", defval: "" });
  if (!rows.length) throw new Error("내용이 없는 파일입니다.");

  const alias = { cargo_no: ["화물번호", "cargono", "코드", "운송장번호"] };
  STAGES.forEach(([k, label]) => alias[k] = [norm(label)]);
  const colOf = key => Object.keys(alias).find(f => alias[f].includes(norm(key)));
  if (!Object.keys(rows[0]).some(k => colOf(k) === "cargo_no")) throw new Error("첫 줄에 '화물번호' 칸이 없습니다. 양식을 내려받아 사용하세요.");

  const errs = [], map = new Map();
  rows.forEach((r, i) => {
    const line = i + 2, o = {};
    for (const [key, val] of Object.entries(r)) {
      const f = colOf(key);
      if (!f) continue;
      if (f === "cargo_no") { const t = String(val).trim(); if (t) o[f] = t; }
      else { const d = fixDate(val); if (d === null) errs.push(`${line}행 '${key}' 날짜 형식을 확인하세요 (${val})`); else if (d) o[f] = d; }
    }
    if (!o.cargo_no) { if (Object.keys(o).length) errs.push(`${line}행: 화물번호가 없습니다`); return; }
    map.set(o.cargo_no, { ...(map.get(o.cargo_no) || {}), ...o });
  });

  const cur = await fetchAll("id,cargo_no");
  const idOf = new Map(cur.filter(s => s.cargo_no).map(s => [s.cargo_no, s.id]));
  const toNew = [], toUpd = [];
  for (const o of map.values()) {
    if (idOf.has(o.cargo_no)) toUpd.push([idOf.get(o.cargo_no), o]);
    else toNew.push(o);
  }
  if (errs.length) {
    res.className = "msg err";
    res.innerHTML = "<b>고칠 곳이 있어 아무것도 올리지 않았습니다.</b><br>" + errs.slice(0, 10).map(esc).join("<br>") + (errs.length > 10 ? `<br>외 ${errs.length - 10}건` : "");
    return;
  }
  if (!toNew.length && !toUpd.length) throw new Error("올릴 화물이 없습니다.");
  if (!confirm(`새 화물 ${toNew.length}건을 추가하고 기존 ${toUpd.length}건을 수정합니다. 올릴까요?`)) { res.textContent = ""; return; }

  res.textContent = "올리는 중...";
  for (let i = 0; i < toNew.length; i += 500) {
    const { error } = await sb.from("shipments").insert(toNew.slice(i, i + 500));
    if (error) throw error;
  }
  for (let i = 0; i < toUpd.length; i += 20) {
    const r = await Promise.all(toUpd.slice(i, i + 20).map(([id, o]) => sb.from("shipments").update(o).eq("id", id)));
    const bad = r.find(x => x.error);
    if (bad) throw bad.error;
  }
  res.className = "msg saved";
  res.textContent = `완료: 새 화물 ${toNew.length}건, 수정 ${toUpd.length}건`;
  loadGrid();
}

async function loadGrid(){
  try { ALL = await fetchAll("*"); }
  catch (error) { $("#grid").innerHTML = `<p class="msg err" style="padding:16px">불러오지 못했습니다: ${esc(error.message)}</p>`; return; }
  renderGrid();
}

function renderGrid(){
  const g = $("#grid"), q = norm($("#sq") && $("#sq").value);
  if (!ALL.length) { g.innerHTML = `<p class="msg" style="padding:16px">등록된 화물이 없습니다. 엑셀 파일을 올리거나 한 건을 추가하세요.</p>`; return; }
  const list = ALL.filter(s => !q || norm(s.cargo_no).includes(q));
  if (!list.length) { g.innerHTML = `<p class="msg" style="padding:16px">검색 결과가 없습니다.</p>`; return; }
  const show = list.slice(0, 50);
  const head = show.map(s => `<th>${esc(s.cargo_no || "(번호 없음)")}
    <button class="plain" data-del="${s.id}" style="margin-top:6px">삭제</button></th>`).join("");
  const rows = STAGES.map(([k, label]) => `<tr><th>${label}</th>` +
    show.map(s => `<td><input type="date" data-id="${s.id}" data-k="${k}" value="${s[k] || ""}" class="${s[k] ? "has" : ""}"></td>`).join("") + `</tr>`).join("");
  const note = list.length > show.length ? `<p class="msg" style="padding:10px 14px">전체 ${list.length}건 중 ${show.length}건만 표시합니다. 검색으로 좁혀 보세요.</p>` : "";
  g.innerHTML = note + `<table><thead><tr><th>단계</th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  g.onchange = async e => {
    const i = e.target;
    if (!i.dataset.k) return;
    const { error } = await sb.from("shipments").update({ [i.dataset.k]: i.value || null }).eq("id", i.dataset.id);
    if (!error) { const s = ALL.find(x => String(x.id) === i.dataset.id); if (s) s[i.dataset.k] = i.value || null; }
    i.classList.toggle("has", !!i.value);
    flash(error ? "저장하지 못했습니다: " + error.message : "저장했습니다");
  };
  g.onclick = async e => {
    const id = e.target.dataset.del;
    if (!id) return;
    if (!confirm("이 화물을 삭제할까요? 되돌릴 수 없습니다.")) return;
    const { error } = await sb.from("shipments").delete().eq("id", id);
    error ? flash("삭제하지 못했습니다") : loadGrid();
  };
}

function loginView(){
  app.innerHTML = `<main><form class="login" id="lf">
    <b style="color:var(--navy);font-size:20px">관리자 로그인</b>
    <input type="email" id="em" placeholder="이메일" required autocomplete="username">
    <input type="password" id="pw" placeholder="비밀번호" required autocomplete="current-password">
    <button class="navy">로그인</button><p class="msg err" id="le"></p></form></main>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) $("#le").textContent = "이메일이나 비밀번호가 맞지 않습니다."; else showAdmin();
  };
}
applyLang();
route();
</script>
</body>
</html>
