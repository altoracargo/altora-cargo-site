<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTORA CARGO 화물 조회</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A3C6E;--navy-d:#12294D;--gold:#B8902A;--gold-l:#E9D9A6;--ink:#1d2433;--mute:#6b7487;--line:#dfe4ee;--bg:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Noto Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;padding:8px 20px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.quick{background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px}
.quick a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;color:#fff}
.quick .call{background:var(--navy)}
.quick .ms{background:#0084FF}
.quick .nav{background:var(--gold);color:#1b1500}
.contact .maps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 6px}
.contact .maps a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;line-height:2;font-size:13px;color:var(--navy);font-weight:500}
.quick svg{width:18px;height:18px;fill:currentColor;flex:none}
.adm .quick{display:none}
.fb{display:flex;flex:none;border-radius:50%;transition:transform .15s}
.fb:hover{transform:scale(1.08)}
.fb svg{display:block}
header img{height:132px;width:132px;flex:none}
header b{color:var(--navy);font-size:20px;letter-spacing:.02em}
.hero{background:var(--navy);color:#fff;padding:44px 20px 52px}
.hero div{max-width:760px;margin:0 auto}
.hero h1{font-size:28px;line-height:1.35;margin:0 0 6px}
.hero p{margin:0 0 22px;color:#c9d4ea}
form.search{display:flex;gap:8px}
input,button{font:inherit}
input[type=text],input[type=email],input[type=password]{padding:12px 14px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{background:var(--gold);color:#1b1500;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;font-weight:700;white-space:nowrap}
button.navy{background:var(--navy);color:#fff}
button.plain{background:#e8ecf4;color:var(--ink);font-weight:500;padding:6px 10px;font-size:13px}
.qf{display:flex;flex:1;align-items:stretch;background:#fff;border-radius:8px;overflow:hidden}
.qf:focus-within{outline:3px solid var(--gold);outline-offset:1px}
.hero .qf{max-width:none;margin:0}
.hero .kinds{display:flex;gap:8px;margin:0 0 12px;max-width:none}
.kinds button{background:transparent;color:#fff;border:1px solid #7f98c4;padding:8px 16px}
.kinds button.on{background:#fff;color:var(--navy);border-color:#fff}
.qf .pf{flex:none;white-space:nowrap;display:flex;align-items:center;padding-left:16px;color:var(--navy);font-weight:700;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.qf input[type=text]{border:0;border-radius:0;padding-left:4px;min-width:0;font-size:18px;letter-spacing:.08em}
.qf input:focus{outline:none}
main{max-width:960px;margin:0 auto;padding:26px 16px 60px}
.msg{color:var(--mute);margin:8px 0}.err{color:#b3261e}
.ship{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.ship h2{margin:0;color:var(--navy);font-size:20px}
.ship .sub{color:var(--mute);margin:0 0 14px}
.now{background:var(--gold-l);border-left:4px solid var(--gold);padding:10px 14px;margin-bottom:18px;font-weight:500}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{position:relative;padding:0 0 18px 34px;color:var(--mute)}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{content:"";position:absolute;left:6px;top:8px;bottom:-8px;width:2px;background:var(--line)}
ol.steps li:last-child::before{display:none}
ol.steps li::after{content:"";position:absolute;left:0;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
ol.steps li.done{color:var(--ink)}
ol.steps li.done::before{background:var(--gold)}
ol.steps li.done::after{background:var(--gold);border-color:var(--gold)}
ol.steps li.cur{color:var(--navy);font-weight:700}
ol.steps li.cur::after{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 5px rgba(26,60,110,.18)}
ol.steps .d{display:block;font-weight:400;font-size:14px}
.lang{margin-left:auto;display:flex;border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.lang button{background:#fff;color:var(--navy);border-radius:0;padding:8px 14px;font-weight:700}
.lang button.on{background:var(--navy);color:#fff}
.adm .lang{display:none}
.tabs{display:flex;gap:8px;margin-bottom:26px}
.tabs button{background:transparent;color:#fff;border:1px solid #7f98c4;padding:9px 18px}
.tabs button.on{background:var(--gold);color:#1b1500;border-color:var(--gold)}
.atabs{margin:0 0 14px}
.atabs button{background:#e8ecf4;color:var(--ink);border:1px solid var(--line)}
.atabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;background:var(--gold-l);color:var(--navy);border-radius:6px;padding:2px 10px;font-size:14px;margin-left:10px;vertical-align:middle}
footer{text-align:center;color:var(--mute);font-size:13px;padding-bottom:30px}
footer a{color:var(--mute)}
.contact{margin:0 auto 16px;padding:0 16px;font-size:14px;line-height:1.9;color:var(--ink)}
.contact b{color:var(--navy);margin-right:4px}
.contact a{color:var(--ink);text-decoration:none}
.adm .contact{display:none}
.login{max-width:380px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input{width:auto;flex:1 1 150px}
.wrap{overflow:auto;max-height:70vh;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
thead th{background:var(--navy);color:#fff;font-weight:500;position:sticky;top:0;z-index:2}
thead th small{display:block;color:#c9d4ea;font-weight:400}
thead th:first-child,tbody th{min-width:140px;position:sticky;left:0;background:#eef1f7;color:var(--navy)}
thead th:first-child{background:var(--navy);color:#fff;left:0;z-index:3}
button:disabled{opacity:.4;cursor:default}
td input{padding:6px;width:100%;font-size:13px}
td{white-space:nowrap}
thead th{min-width:130px}
thead th:last-child{min-width:70px}
td input.has{border-color:var(--gold);background:#fffaf0}
td input.mixed{border-color:#b3261e;background:#fff3f1}
tr.grp>th{background:#e6ecf7}
.chips{white-space:normal;line-height:2}
.chips span{display:inline-block;background:#eef1f7;border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 6px 4px 0;font-size:13px}
.saved{color:var(--gold);font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:16px}.panel p{margin:4px 0 10px}
@media(max-width:560px){form.search{flex-direction:column}.hero h1{font-size:23px}header img{height:92px;width:92px}header b{display:none}}
</style>

  if (location.hash === "#admin") location.hash = "";   // hashchange 가 조회 화면을 다시 그림
  else showTrack();
};

/* ---------- 고객 조회 화면 ---------- */
/* 항공 화물번호는 G-1-0000 형식: 앞의 G-1-은 자동, 고객은 뒤 4자리만 입력 */
const AIR_PFX = "G-1-";
/* 해상 화물번호: 일반 ORA-0000 / 익스프레스 ALT-0000. 종류를 고르고 뒤 4자리만 입력 */
let SEA_K = "ORA";
function seaDigits(v){ return String(v ?? "").replace(/^\s*(ora|alt)\s*-?/i, "").replace(/\D/g, "").slice(0, 4); }
function setKind(k){
  SEA_K = k;
  const pf = $("#pf"); if (pf) pf.textContent = k + "-";
  document.querySelectorAll(".kinds button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
}
function airDigits(v){
  v = String(v ?? "");
  if (/^\s*(ora|alt)/i.test(v)) return v;               // 해상 번호를 잘못 넣은 경우 안내가 나오도록 그대로 둠
  return v.replace(/^\s*g\s*-?\s*1\s*-/i, "").replace(/\D/g, "").slice(0, 4);
}
function showTrack(){
  app.innerHTML = `
    <section class="hero"><div>
      <div class="tabs">${["air", "sea"].map(m => `<button type="button" data-m="${m}" class="${m === CM ? "on" : ""}">${T(m)}</button>`).join("")}</div>
      <h1>${T("title")}</h1>
      <p>${T(CM === "air" ? "subAir" : "subSea")}</p>
      ${CM === "sea" ? `<div class="kinds">${["ORA", "ALT"].map(k => `<button type="button" data-k="${k}" class="${k === SEA_K ? "on" : ""}">${T(k === "ORA" ? "general" : "express")} (${k}-)</button>`).join("")}</div>` : ""}
      <form class="search" id="f">
        <div class="qf"><span class="pf" id="pf">${CM === "air" ? AIR_PFX : SEA_K + "-"}</span><input type="text" id="q" inputmode="numeric" autocomplete="off" placeholder="0000" required></div>
        <button>${T("go")}</button>
      </form>
    </div></section>
    <main><div id="out"></div></main>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { CM = b.dataset.m; lastQ = ""; showTrack(); });
  if (CM === "air") $("#q").oninput = e => { e.target.value = airDigits(e.target.value); };
  else {
    $("#q").oninput = e => {
      const m = e.target.value.match(/^\s*(ora|alt)/i);   // ORA-0123 / ALT-0123 을 통째로 붙여넣으면 종류도 자동 선택
      if (m) setKind(m[1].toUpperCase());
      e.target.value = seaDigits(e.target.value);
    };
    document.querySelectorAll(".kinds button").forEach(b => b.onclick = () => { setKind(b.dataset.k); $("#q").focus(); });
  }
  $("#f").onsubmit = e => {
    e.preventDefault();
    const v = $("#q").value.trim();
    if (CM === "air") search(!SEA_RE.test(v) ? AIR_PFX + airDigits(v) : v);
    else search(SEA_K + "-" + seaDigits(v));
  };
  if (lastQ) {
    if (CM === "air") $("#q").value = airDigits(lastQ);
    else { const m = lastQ.match(/^(ORA|ALT)/i); if (m) setKind(m[1].toUpperCase()); $("#q").value = seaDigits(lastQ); }
    search(lastQ);
  }
}

async function search(q){
  lastQ = q;
  const out = $("#out"), m = CM;
  out.innerHTML = `<p class="msg">${T("wait")}</p>`;
  const { data, error } = await sb.rpc(MODES[m].rpc, { q });
  if (m !== CM) return;
  if (error) { out.innerHTML = `<p class="msg err">${T("fail")}</p>`; return; }
  if (!data.length) { out.innerHTML = `<p class="msg">${T("none")}${m === "air" && SEA_RE.test(q) ? " " + T("hintSea") : ""}</p>`; return; }
  out.innerHTML = data.map(s => card(s, m)).join("");
}

function card(s, m){
  const S = MODES[m].stages, n = LANG === "mn" ? 2 : 1;
  let cur = -1;
  S.forEach(([k], i) => { if (s[k]) cur = i; });
  const now = cur < 0 ? T("notyet") : `${T("cur")}: ${S[cur][n]} (${s[S[cur][0]]})`;
  const steps = S.map((st, i) => {
    const cls = i === cur ? "cur" : s[st[0]] ? "done" : "";
    return `<li class="${cls}">${st[n]}<span class="d">${s[st[0]] ? esc(s[st[0]]) : T("plan")}</span></li>`;
  }).join("");
  const kind = m === "sea" && kindOf(s.cargo_no) ? `<span class="badge">${T(kindOf(s.cargo_no))}</span>` : "";
  return `<div class="ship">
    <h2 style="margin-bottom:14px">${T("cargo")} ${esc(s.cargo_no)}${kind}</h2>
    <div class="now">${esc(now)}</div>
    <ol class="steps">${steps}</ol></div>`;
}

/* ---------- 관리자 화면 ---------- */
async function fetchAll(cols){
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(MODES[AM].tbl).select(cols).order("id").range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}

function flash(t){ const s = $("#st"); if (s){ s.textContent = t; clearTimeout(flash.t); flash.t = setTimeout(() => s.textContent = "", 2500); } }

function fixDate(v){
  v = String(v ?? "").trim();
  if (!v) return "";
  const m = v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (!m) return null;
  const d = `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  return isNaN(new Date(d)) ? null : d;
}

async function importExcel(file, res){
  const S = MODES[AM].stages, sea = AM === "sea", tbl = MODES[AM].tbl;
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, dateNF: "yyyy-mm-dd", defval: "" });
  if (!rows.length) throw new Error("내용이 없는 파일입니다.");

  const alias = { cargo_no: ["화물번호", "cargono", "코드", "운송장번호"] };
  S.forEach(([k, l]) => alias[k] = [norm(l), norm(l.split(" (")[0])]);
  const colOf = key => Object.keys(alias).find(f => alias[f].includes(norm(key)));
  if (!Object.keys(rows[0]).some(k => colOf(k) === "cargo_no")) throw new Error("첫 줄에 '화물번호' 칸이 없습니다. 양식을 내려받아 사용하세요.");

  const errs = [], map = new Map();
  rows.forEach((r, i) => {
    const line = i + 2, o = {};
    for (const [key, val] of Object.entries(r)) {
      const f = colOf(key);
      if (!f) continue;
      if (f === "cargo_no") { let t = String(val).trim(); if (sea) t = t.toUpperCase(); if (t) o[f] = t; }
      else { const d = fixDate(val); if (d === null) errs.push(`${line}행 '${key}' 날짜 형식을 확인하세요 (${val})`); else if (d) o[f] = d; }
    }
    if (!o.cargo_no) { if (Object.keys(o).length) errs.push(`${line}행: 화물번호가 없습니다`); return; }
    if (sea && !SEA_RE.test(o.cargo_no)) { errs.push(`${line}행: 해상 화물번호 형식이 아닙니다 (${o.cargo_no}). ORA-0000 또는 ALT-0000`); return; }
    map.set(o.cargo_no, { ...(map.get(o.cargo_no) || {}), ...o });
  });

  const grp = file.name.replace(/\.[^.]+$/, "").trim();
  if (!grp) throw new Error("파일 이름이 비어 있습니다.");
  for (const o of map.values()) o.group_name = grp;
  const cur = await fetchAll("id,cargo_no");
  const idOf = new Map(cur.filter(s => s.cargo_no).map(s => [s.cargo_no, s.id]));
  const toNew = [], toUpd = [];
  for (const o of map.values()) idOf.has(o.cargo_no) ? toUpd.push([idOf.get(o.cargo_no), o]) : toNew.push(o);
  if (errs.length) {
    res.className = "msg err";
    res.innerHTML = "<b>고칠 곳이 있어 아무것도 올리지 않았습니다.</b><br>" + errs.slice(0, 10).map(esc).join("<br>") + (errs.length > 10 ? `<br>외 ${errs.length - 10}건` : "");
    return;
  }
  if (!toNew.length && !toUpd.length) throw new Error("올릴 화물이 없습니다.");
  if (!confirm(`[${MODES[AM].file} 화물] '${grp}' 그룹으로 새 화물 ${toNew.length}건을 추가하고 기존 ${toUpd.length}건을 수정합니다. 올릴까요?`)) { res.textContent = ""; return; }

  res.textContent = "올리는 중...";
  for (let i = 0; i < toNew.length; i += 500) {
    const { error } = await sb.from(tbl).insert(toNew.slice(i, i + 500));
    if (error) throw error;
  }
  for (let i = 0; i < toUpd.length; i += 20) {
    const r = await Promise.all(toUpd.slice(i, i + 20).map(([id, o]) => sb.from(tbl).update(o).eq("id", id)));
    const bad = r.find(x => x.error);
    if (bad) throw bad.error;
  }
  res.className = "msg saved";
  res.textContent = `완료: '${grp}' 그룹 — 새 화물 ${toNew.length}건, 수정 ${toUpd.length}건. 아래 표에서 그룹 날짜를 지정하세요.`;
  PAGE = 0;
  loadGrid();
}

async function loadGrid(){
  try { ALL = await fetchAll("*"); }
  catch (error) { $("#grid").innerHTML = `<p class="msg err" style="padding:16px">불러오지 못했습니다: ${esc(error.message)}</p>`; return; }
  renderGrid();
}

let OPEN = new Set();
function buildItems(q){
  const gm = new Map(), items = [];
  ALL.forEach((s, i) => {
    if (s.group_name) {
      let g = gm.get(s.group_name);
      if (!g) { g = { type: "g", name: s.group_name, rows: [], max: 0 }; gm.set(s.group_name, g); items.push(g); }
      g.rows.push(s); g.max = i;
    } else items.push({ type: "r", row: s, max: i });
  });
  return items.filter(it => !q || (it.type === "g"
      ? norm(it.name).includes(q) || it.rows.some(r => norm(r.cargo_no).includes(q))
      : norm(it.row.cargo_no).includes(q))).sort((a, b) => b.max - a.max);
}
/* 그룹 안 날짜가 모두 같으면 그 날짜, 서로 다르면 null, 비어 있으면 "" */
function groupVal(rows, k){
  const v = new Set(rows.map(r => r[k] || ""));
  return v.size === 1 ? [...v][0] : null;
}
function groupNow(rows){
  const o = {};
  MODES[AM].stages.forEach(([k]) => { o[k] = rows.some(r => r[k]) ? 1 : ""; });
  return stageNow(o);
}
function groupRow(it, S){
  const n = esc(it.name), open = OPEN.has(it.name);
  const cells = S.map(([k]) => {
    const v = groupVal(it.rows, k);
    return `<td><input type="date" data-g="${n}" data-k="${k}" value="${v || ""}" class="${v ? "has" : ""}${v === null ? " mixed" : ""}"${v === null ? ' title="그룹 안 날짜가 서로 다릅니다. 새로 지정하면 모두 같은 날짜로 바뀝니다."' : ""}></td>`;
  }).join("");
  const codes = open ? `<tr><td colspan="${S.length + 3}" class="chips">${it.rows.map(r => `<span>${esc(r.cargo_no)}</span>`).join("")}</td></tr>` : "";
  return `<tr class="grp"><th>${n}<br><small style="font-weight:400">화물 ${it.rows.length}건</small><br><button class="plain" data-open="${n}">${open ? "코드 닫기" : "코드 보기"}</button></th>` +
    cells + `<td data-gnow="${n}">${groupNow(it.rows)}</td><td><button class="plain" data-gdel="${n}">그룹 삭제</button></td></tr>` + codes;
}

function stageNow(s){
  let c = -1;
  const S = MODES[AM].stages;
  S.forEach(([k], i) => { if (s[k]) c = i; });
  return c < 0 ? "-" : S[c][1].split(" (")[0];
}

function renderGrid(){
  const g = $("#grid"), pg = $("#pg"), q = norm($("#sq") && $("#sq").value), S = MODES[AM].stages, sea = AM === "sea";
  pg.innerHTML = "";
  if (!ALL.length) { g.innerHTML = `<p class="msg" style="padding:16px">등록된 화물이 없습니다. 엑셀 파일을 올리거나 한 건을 추가하세요.</p>`; return; }
  const list = buildItems(q);
  if (!list.length) { g.innerHTML = `<p class="msg" style="padding:16px">검색 결과가 없습니다.</p>`; return; }
  const pages = Math.ceil(list.length / PAGE_SIZE);
  if (PAGE > pages - 1) PAGE = pages - 1;
  if (PAGE < 0) PAGE = 0;
  const show = list.slice(PAGE * PAGE_SIZE, (PAGE + 1) * PAGE_SIZE);
  const head = `<tr><th>그룹 / 화물번호</th>${S.map(s => `<th>${s[1].split(" (")[0]}</th>`).join("")}<th>현재 단계</th><th></th></tr>`;
  const rows = show.map(it => {
    if (it.type === "g") return groupRow(it, S);
    const s = it.row;
    const kd = sea && kindOf(s.cargo_no) ? `<br><small style="font-weight:400">${kindOf(s.cargo_no) === "general" ? "일반" : "익스프레스"}</small>` : "";
    return `<tr><th>${esc(s.cargo_no || "(번호 없음)")}${kd}</th>` +
      S.map(([k]) => `<td><input type="date" data-id="${s.id}" data-k="${k}" value="${s[k] || ""}" class="${s[k] ? "has" : ""}"></td>`).join("") +
      `<td data-now="${s.id}">${stageNow(s)}</td><td><button class="plain" data-del="${s.id}">삭제</button></td></tr>`;
  }).join("");
  g.innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  pg.innerHTML = `<span class="msg" style="margin:0">그룹·개별 항목 ${list.length}개 중 ${PAGE * PAGE_SIZE + 1}~${PAGE * PAGE_SIZE + show.length}번째</span>` +
    (pages > 1 ? `<button class="plain" id="pp" ${PAGE === 0 ? "disabled" : ""}>이전</button><span>${PAGE + 1} / ${pages}</span><button class="plain" id="pn" ${PAGE >= pages - 1 ? "disabled" : ""}>다음</button>` : "");
  if (pages > 1) {
    $("#pp").onclick = () => { PAGE--; renderGrid(); g.scrollTop = 0; };
    $("#pn").onclick = () => { PAGE++; renderGrid(); g.scrollTop = 0; };
  }
  g.onchange = async e => {
    const i = e.target;
    if (!i.dataset.k) return;
    if ("g" in i.dataset) {
      const name = i.dataset.g, k = i.dataset.k, val = i.value || null;
      const { error } = await sb.from(MODES[AM].tbl).update({ [k]: val }).eq("group_name", name);
      if (error) return flash("저장하지 못했습니다: " + error.message);
      let n = 0, rows = [];
      ALL.forEach(s => { if (s.group_name === name) { s[k] = val; rows.push(s); n++; } });
      i.classList.toggle("has", !!val); i.classList.remove("mixed"); i.removeAttribute("title");
      g.querySelectorAll("[data-gnow]").forEach(c => { if (c.dataset.gnow === name) c.textContent = groupNow(rows); });
      return flash(`'${name}' 그룹 ${n}건에 저장했습니다`);
    }
    const { error } = await sb.from(MODES[AM].tbl).update({ [i.dataset.k]: i.value || null }).eq("id", i.dataset.id);
    if (!error) {
      const s = ALL.find(x => String(x.id) === i.dataset.id);
      if (s) {
        s[i.dataset.k] = i.value || null;
        const c = g.querySelector(`[data-now="${i.dataset.id}"]`);
        if (c) c.textContent = stageNow(s);
      }
    }
    i.classList.toggle("has", !!i.value);
    flash(error ? "저장하지 못했습니다: " + error.message : "저장했습니다");
  };
  g.onclick = async e => {
    const d = e.target.dataset;
    if (d.open !== undefined) {
      OPEN.has(d.open) ? OPEN.delete(d.open) : OPEN.add(d.open);
      const top = g.scrollTop; renderGrid(); g.scrollTop = top; return;
    }
    if (d.gdel !== undefined) {
      const cnt = ALL.filter(s => s.group_name === d.gdel).length;
      if (!confirm(`'${d.gdel}' 그룹과 안에 있는 화물 ${cnt}건을 모두 삭제할까요? 되돌릴 수 없습니다.`)) return;
      const { error } = await sb.from(MODES[AM].tbl).delete().eq("group_name", d.gdel);
      error ? flash("삭제하지 못했습니다: " + error.message) : loadGrid();
      return;
    }
    const id = d.del;
    if (!id) return;
    if (!confirm("이 화물을 삭제할까요? 되돌릴 수 없습니다.")) return;
    const { error } = await sb.from(MODES[AM].tbl).delete().eq("id", id);
    error ? flash("삭제하지 못했습니다") : loadGrid();
  };
}

function loginView(){
  app.innerHTML = `<main><form class="login" id="lf">
    <b style="color:var(--navy);font-size:20px">관리자 로그인</b>
    <input type="email" id="em" placeholder="이메일" required autocomplete="username">
    <input type="password" id="pw" placeholder="비밀번호" required autocomplete="current-password">
    <button class="navy">로그인</button><p class="msg err" id="le"></p></form></main>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) $("#le").textContent = "이메일이나 비밀번호가 맞지 않습니다."; else showAdmin();
  };
}

applyLang();
route();
</script>
